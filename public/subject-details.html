<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Attendify - Subject Details</title>
    <link rel="icon" href="/logo.png" type="image/png">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">

    <!-- Clerk Auth -->
    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_YnJpZ2h0LW1vcmF5LTIuY2xlcmsuYWNjb3VudHMuZGV2JA"
        src="https://bright-moray-2.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js" type="text/javascript"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff3b3b",
                        "accent-red": "#ff4d4d",
                        "dark-red": "#7a0000",
                        "deep-bg": "#050505",
                        "card-bg": "#0d0d0d",
                        "border-color": "#1f1f1f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>

<body class="dark bg-deep-bg text-white font-display min-h-screen flex flex-col" x-data="subjectDetailsData()"
    x-init="initData()">

    <!-- Header Navigation -->
    <header
        class="hidden md:flex items-center justify-between border-b border-border-color bg-deep-bg px-4 sm:px-10 py-4 sticky top-0 z-50">
        <div class="flex items-center gap-4 sm:gap-10">
            <div class="flex items-center gap-3 text-primary">
                <span class="material-symbols-outlined text-3xl font-black">analytics</span>
                <h2
                    class="text-white text-lg sm:text-xl font-black uppercase tracking-[0.2em] leading-tight hidden sm:block">
                    Attendify</h2>
            </div>
        </div>

        <div class="flex flex-1 justify-end gap-4 sm:gap-6 sm:gap-10 items-center">
                        <nav class="hidden md:flex items-center gap-8">
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest" href="/">Dashboard</a>
                <a class="text-primary border-b border-primary py-1 text-[10px] sm:text-xs font-bold uppercase tracking-widest" href="/subjects">Subjects</a>
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest" href="/calendar">Calendar</a>
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest" href="/calculator">Calculator</a>
                <a class="text-neutral-500 hover:text-white transition-all text-[10px] sm:text-xs font-bold uppercase tracking-widest" href="/profile">Profile</a>
            </nav>
            <div class="hidden">
                <div id="user-button"></div>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-deep-bg border-t border-border-color z-50 flex justify-around items-center pt-2 pb-4 px-2 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
        <a href="/" class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[24px]">home</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Home</span>
        </a>
        <a href="/subjects" class="flex flex-col items-center gap-1 p-2 text-primary">
            <span class="material-symbols-outlined text-[24px]">library_books</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Subjects</span>
        </a>
        <a href="/calendar" class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[24px]">calendar_month</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Calendar</span>
        </a>
        <a href="/profile" class="flex flex-col items-center gap-1 p-2 text-neutral-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined text-[24px]">person</span>
            <span class="text-[9px] font-black uppercase tracking-widest">Profile</span>
        </a>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1280px] mx-auto px-4 sm:px-10 pt-4 sm:pt-10 pb-24 md:pb-10" id="main-content"
        x-show="!loading" style="opacity: 0; transition: opacity 0.5s ease;">

        <div class="mb-8">
            <a href="/"
                class="text-[10px] font-bold uppercase tracking-widest text-neutral-500 hover:text-white transition-all flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Dashboard
            </a>
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 sm:gap-6">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <h1 class="text-3xl sm:text-5xl font-black leading-none tracking-tighter uppercase text-white"
                            x-text="subject?.subject_name"></h1>
                        <span class="px-2 py-1 text-[10px] font-black tracking-widest uppercase rounded border"
                            :class="statusBadgeClass(subject?.status)" x-text="subject?.status"></span>
                    </div>
                    <p class="text-neutral-500 text-sm font-medium uppercase tracking-widest"
                        x-text="subject?.faculty_name || 'No Faculty'"></p>
                </div>

                <!-- Mark Quick Actions -->
                <div class="flex gap-2 rounded bg-card-bg border border-border-color p-2 neo-shadow">
                    <button @click="markAttendance('present')"
                        class="flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-green-500/20 text-neutral-300 hover:text-green-500 border border-transparent hover:border-green-500/50 rounded transition-all">
                        <span class="material-symbols-outlined text-[20px]">check_circle</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Present</span>
                    </button>
                    <button @click="markAttendance('absent')"
                        class="flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-primary/20 text-neutral-300 hover:text-primary border border-transparent hover:border-primary/50 rounded transition-all">
                        <span class="material-symbols-outlined text-[20px]">cancel</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Absent</span>
                    </button>
                    <button @click="markAttendance('extra')"
                        class="flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-blue-500/20 text-neutral-300 hover:text-blue-500 border border-transparent hover:border-blue-500/50 rounded transition-all">
                        <span class="material-symbols-outlined text-[20px]">add_circle</span>
                        <span class="text-[10px] font-black uppercase tracking-widest">Extra</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">

            <!-- Main Stats Card -->
            <div
                class="lg:col-span-2 rounded bg-card-bg border border-border-color neo-shadow overflow-hidden flex flex-col justify-between p-8">
                <div>
                    <h3
                        class="text-white text-xs font-black uppercase tracking-[0.2em] mb-8 border-l-2 border-primary pl-3">
                        Current Performance</h3>

                    <div class="flex items-baseline gap-4 mb-4">
                        <p class="text-5xl sm:text-7xl font-black text-white"
                            x-text="subject?.current_percentage + '%'"></p>
                        <p class="text-xs font-bold text-neutral-500 uppercase tracking-widest"
                            x-text="'Required: ' + subject?.min_requirement_percentage + '%'"></p>
                    </div>

                    <div class="w-full bg-neutral-900 h-2 rounded-full mb-8 overflow-hidden">
                        <div class="h-full transition-all duration-1000"
                            :class="bgPercentageColor(subject?.current_percentage, subject?.min_requirement_percentage)"
                            :style="`width: ${subject?.current_percentage}%`"></div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
                        <div>
                            <p class="text-[10px] font-black text-neutral-500 uppercase tracking-widest mb-1">Total</p>
                            <p class="text-2xl font-black text-white" x-text="subject?.total_classes"></p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-neutral-500 uppercase tracking-widest mb-1">Attended
                            </p>
                            <p class="text-2xl font-black text-white" x-text="subject?.attended_classes"></p>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-neutral-500 uppercase tracking-widest mb-1">Missed</p>
                            <p class="text-2xl font-black text-primary"
                                x-text="subject?.total_classes - subject?.attended_classes"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Analysis / Recommendations Card -->
            <div
                class="rounded bg-primary p-8 text-white neo-shadow relative overflow-hidden flex flex-col justify-between border border-primary/50">
                <div class="absolute top-0 right-0 p-4 opacity-20">
                    <span class="material-symbols-outlined text-8xl">radar</span>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-6">
                        <span class="material-symbols-outlined text-2xl font-black">terminal</span>
                        <h3 class="font-black text-xs uppercase tracking-[0.2em]">Buffer Analysis</h3>
                    </div>

                    <template x-if="subject?.status === 'safe' || subject?.status === 'warning'">
                        <div class="space-y-4">
                            <p
                                class="text-white/80 text-xs leading-relaxed font-medium uppercase tracking-wider border-b border-white/20 pb-4">
                                You are currently meeting attendance requirements.</p>
                            <div class="bg-black/20 p-5 border-l-2 border-white/40">
                                <p class="text-[9px] font-black uppercase tracking-widest text-white/60 mb-2">SAFE
                                    MARGIN</p>
                                <p class="text-sm font-black uppercase">Can miss next <span
                                        class="text-white font-black text-xl mx-1"
                                        x-text="subject?.buffer_classes"></span> classes</p>
                            </div>
                        </div>
                    </template>

                    <template x-if="subject?.status === 'danger'">
                        <div class="space-y-4">
                            <p
                                class="text-white/80 text-xs leading-relaxed font-medium uppercase tracking-wider border-b border-white/20 pb-4">
                                You are below the minimum attendance requirement.</p>
                            <div class="bg-black/20 p-5 border-l-2 border-white/40">
                                <p class="text-[9px] font-black uppercase tracking-widest text-white/60 mb-2">RECOVERY
                                    TARGET</p>
                                <p class="text-sm font-black uppercase">Must attend next <span
                                        class="text-white font-black text-xl mx-1"
                                        x-text="subject?.recovery_classes"></span> classes</p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Attendance History Table -->
        <div class="rounded bg-card-bg border border-border-color neo-shadow overflow-hidden">
            <div class="px-8 py-6 border-b border-border-color flex justify-between items-center">
                <h3 class="text-white text-xs font-black uppercase tracking-[0.2em]">Attendance Record Log</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-black/40">
                            <th class="px-8 py-4 text-[10px] font-black text-neutral-500 uppercase tracking-widest">Date
                            </th>
                            <th class="px-8 py-4 text-[10px] font-black text-neutral-500 uppercase tracking-widest">
                                Status</th>
                            <th
                                class="px-8 py-4 text-right text-[10px] font-black text-neutral-500 uppercase tracking-widest">
                                Options</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-border-color">
                        <template x-if="history.length === 0">
                            <tr>
                                <td colspan="3"
                                    class="px-8 py-8 text-center text-neutral-500 text-xs italic uppercase tracking-widest">
                                    No records found.</td>
                            </tr>
                        </template>
                        <template x-for="record in history" :key="record.id">
                            <tr class="hover:bg-primary/5 transition-colors group">
                                <td class="px-8 py-5 text-xs text-white uppercase tracking-wider"
                                    x-text="formatDate(record.date)"></td>
                                <td class="px-8 py-5">
                                    <span
                                        class="px-2 py-1 border text-[10px] font-black uppercase tracking-widest rounded transition-all"
                                        :class="recordStatusClass(record.status)" x-text="record.status"></span>
                                </td>
                                <td class="px-8 py-5 text-right">
                                    <button @click="deleteRecord(record.id)"
                                        class="text-neutral-600 hover:text-primary transition-colors disabled:opacity-50"
                                        :disabled="deletingRec === record.id">
                                        <span class="material-symbols-outlined text-[18px]">delete</span>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('subjectDetailsData', () => ({
                loading: true,

                subjectId: null,
                subject: null,
                history: [],
                deletingRec: null,

                async initData() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.subjectId = urlParams.get('id');

                    if (!this.subjectId) {
                        window.location.href = '/subjects';
                        return;
                    }

                    window.addEventListener('load', async () => {
                        await Clerk.load();
                        const userButtonDiv = document.getElementById('user-button');
                        if (typeof Clerk === "undefined") { setTimeout(() => this.initData(), 100); return; }
                        if (Clerk.user) {
                            Clerk.mountUserButton(userButtonDiv);
                            document.getElementById('main-content').style.opacity = '1';
                            await this.fetchData();
                        } else {
                            window.location.href = '/sign-in';
                        }
                    });
                },

                async fetchData() {
                    this.loading = true;
                    try {
                        const response = await fetch(`/api/subjects/${this.subjectId}`);
                        if (response.ok) {
                            const data = await response.json();
                            this.subject = data.subject;
                            this.history = data.history;
                        } else {
                            window.showToast('Subject not found', 'error');
                            setTimeout(() => { window.location.href = '/subjects'; }, 1000);
                        }
                    } catch (err) {
                        console.error(err);
                        window.showToast('Communication Error', 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                async markAttendance(status) {
                    const today = new Date().toISOString().split('T')[0];
                    try {
                        const res = await fetch('/api/attendance/mark', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ subjectId: this.subjectId, status, date: today })
                        });
                        if (res.ok) {
                            window.showToast('Attendance Marked!', 'success');
                            await this.fetchData();
                        } else {
                            window.showToast('Failed to mark attendance', 'error');
                        }
                    } catch (e) {
                        console.error('Failed to mark', e);
                        window.showToast('Communication Error', 'error');
                    }
                },

                async deleteRecord(recordId) {
                    if (confirm('Are you sure you want to delete this record? This will adjust your overall attendance stats.')) {
                        this.deletingRec = recordId;
                        try {
                            const res = await fetch(`/api/attendance/${this.subjectId}/${recordId}`, { method: 'DELETE' });
                            if (res.ok) {
                                window.showToast('Record Deleted', 'success');
                                await this.fetchData();
                            } else {
                                window.showToast('Failed to delete', 'error');
                            }
                        } catch (e) {
                            console.error(e);
                            window.showToast('Communication Error', 'error');
                        } finally {
                            this.deletingRec = null;
                        }
                    }
                },

                bgPercentageColor(val, req) {
                    if (!val) return 'bg-white/10';
                    if (val >= req) return 'bg-white/80';
                    if (val >= req - 5) return 'bg-orange-500';
                    return 'bg-primary';
                },

                statusBadgeClass(status) {
                    if (status === 'safe') return 'border-green-500/30 bg-green-500/10 text-green-500';
                    if (status === 'warning') return 'border-orange-500/30 bg-orange-500/10 text-orange-500';
                    return 'border-primary/30 bg-primary/10 text-primary';
                },

                recordStatusClass(status) {
                    if (status === 'present') return 'border-green-500/30 bg-green-500/10 text-green-500';
                    if (status === 'absent') return 'border-primary/30 bg-primary/10 text-primary';
                    if (status === 'extra') return 'border-blue-500/30 bg-blue-500/10 text-blue-500';
                    return 'border-neutral-500/30 bg-neutral-500/10 text-neutral-500';
                },

                formatDate(dateStr) {
                    const options = { year: 'numeric', month: 'short', day: 'numeric' };
                    return new Date(dateStr).toLocaleDateString('en-US', options);
                }
            }));
        });
    </script>
    <!-- Toast container - fixed popup below any header -->
    <div id="toast-container" class="fixed top-20 right-4 z-[9999] flex flex-col gap-2 pointer-events-none w-72 max-w-[calc(100vw-2rem)]"></div>
    <script src="/js/geo.js"></script>
</body>

</html>
